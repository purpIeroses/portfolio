baseURL = "https://sophianawasreh.dpdns.org/"
locale = "en-us"
title = "Sophia Al-Nawasreh — Builder"
enableRobotsTXT = true

# Pin this to match the Hugo version your host builds with (see deploy guide).
# Cloudflare/Netlify read HUGO_VERSION from an env var, not from here — this is
# just a reminder of the version you developed against.
# Developed against: Hugo extended 0.164.x

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  author = "Sophia Al-Nawasreh"
  email = "sophiaalnawasreh@gmail.com"

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1
    title = "Sophia Al-Nawasreh — Builder"
    [languages.en.params]
      description = "I ship working products fast — then harden them. Freelance builder working across game dev, full-stack, AI integration, and design."
      tagline = "I ship working products fast — then make them hold up."
    [[languages.en.menu.main]]
      name = "Work"
      url = "/#work"
      weight = 1
    [[languages.en.menu.main]]
      name = "About"
      url = "/#about"
      weight = 2
    [[languages.en.menu.main]]
      name = "Contact"
      url = "/contact/"
      weight = 3

  [languages.ar]
    label = "العربية"
    locale = "ar"
    weight = 2
    title = "صوفيا النواصره — مطوّرة"
    [languages.ar.params]
      author = "صوفيا النواصره"
      description = "أُطلق منتجات فعّالة بسرعة — ثم أعمل على تحصينها. مطوّرة مستقلة أعمل في تطوير الألعاب، والتطوير الشامل، ودمج الذكاء الاصطناعي، والتصميم."
      tagline = "أُطلق منتجات فعّالة بسرعة — ثم أجعلها تصمد."
    [[languages.ar.menu.main]]
      name = "الأعمال"
      url = "/#work"
      weight = 1
    [[languages.ar.menu.main]]
      name = "نبذة"
      url = "/#about"
      weight = 2
    [[languages.ar.menu.main]]
      name = "تواصل"
      url = "/contact/"
      weight = 3

[markup.goldmark.renderer]
  unsafe = true  # allow raw HTML in markdown (for embeds/screenshots)

[build]
  writeStats = false
