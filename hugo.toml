baseURL = "https://sophianawasreh.dpdns.org/"
locale = "en-us"
title = "Sophia Al-Nawasreh — Builder"
enableRobotsTXT = true

# Pin this to match the Hugo version your host builds with (see deploy guide).
# Cloudflare/Netlify read HUGO_VERSION from an env var, not from here — this is
# just a reminder of the version you developed against.
# Developed against: Hugo extended 0.164.x

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  author = "Sophia Al-Nawasreh"
  email = "sophiaalnawasreh@gmail.com"

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1
    title = "Sophia Al-Nawasreh — Builder"
    [languages.en.params]
      og_image = "images/linkpreviewENG.png"
      og_image_alt = "Sophia Al-Nawasreh — freelance builder portfolio"
      og_locale = "en_US"
      description = "Freelance builder — games, full-stack web, AI features and design. I get to a working version quickly, then go back for the parts that version skipped."
      tagline = "I build things, and I care whether they actually work."
      manifest_short_name = "Sophia"
    [[languages.en.menu.main]]
      name = "Work"
      url = "/#work"
      weight = 1
    [[languages.en.menu.main]]
      name = "About"
      url = "/#about"
      weight = 2
    [[languages.en.menu.main]]
      name = "Contact"
      url = "/contact/"
      weight = 3

  [languages.ar]
    label = "العربية"
    locale = "ar"
    weight = 2
    title = "صوفيا النواصره — مطوّرة"
    [languages.ar.params]
      og_image = "images/linkpreviewAR.png"
      og_image_alt = "صوفيا النواصره — موقع أعمال مطوّرة مستقلة"
      og_locale = "ar_AR"
      author = "صوفيا النواصره"
      description = "مطوّرة مستقلة: ألعاب، وتطوير ويب شامل، وميزات ذكاء اصطناعي، وتصميم. أصل إلى نسخة تعمل بسرعة، ثم أعود إلى الأجزاء التي تخطّتها تلك النسخة."
      tagline = "أبني أشياء، ويهمّني أن تعمل فعلاً."
      manifest_short_name = "صوفيا"
    [[languages.ar.menu.main]]
      name = "الأعمال"
      url = "/#work"
      weight = 1
    [[languages.ar.menu.main]]
      name = "نبذة"
      url = "/#about"
      weight = 2
    [[languages.ar.menu.main]]
      name = "تواصل"
      url = "/contact/"
      weight = 3

# Web app manifest, generated per language from layouts/index.webmanifest so the
# installed-app name matches the page it was installed from (Hugo writes
# /site.webmanifest and /ar/site.webmanifest). isPlainText keeps the em dash and
# the Arabic title from being escaped into HTML entities, which would be invalid
# JSON; notAlternative keeps the format out of rel="alternate" listings.
[mediaTypes]
  [mediaTypes."application/manifest+json"]
    suffixes = ["webmanifest"]

[outputFormats]
  [outputFormats.WebAppManifest]
    mediaType = "application/manifest+json"
    baseName = "site"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "WebAppManifest"]

[markup.goldmark.renderer]
  unsafe = true  # allow raw HTML in markdown (for embeds/screenshots)

[build]
  writeStats = false
