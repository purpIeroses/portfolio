{{ define "main" }}
<section class="contact-page">
  <a class="case-back" href="{{ "/" | relLangURL }}">{{ i18n "case_back_home" }}</a>

  <div class="contact-head">
    <h1>{{ i18n "contact_title" }}</h1>
    <p>{{ i18n "contact_intro_before" }}<a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>{{ i18n "contact_intro_after" }}</p>
  </div>

  <form id="contact-form" class="contact-form" novalidate>
    <div class="field">
      <label for="name">{{ i18n "form_name" }}</label>
      <input type="text" id="name" name="name" required autocomplete="name">
    </div>
    <div class="field">
      <label for="email">{{ i18n "form_email" }}</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="message">{{ i18n "form_message" }}</label>
      <textarea id="message" name="message" rows="6" required></textarea>
    </div>
    <div class="field field-hp" aria-hidden="true">
      <label for="company">{{ i18n "form_company" }}</label>
      <input type="text" id="company" name="company" tabindex="-1" autocomplete="off">
    </div>
    <button class="btn" type="submit">{{ i18n "form_submit" }}</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>
</section>

<script>
  (function () {
    var form = document.getElementById('contact-form');
    var status = form.querySelector('.form-status');
    var btn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = Object.fromEntries(new FormData(form).entries());

      btn.disabled = true;
      status.textContent = "{{ i18n "js_sending" }}";
      status.className = 'form-status';

      fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(function (res) {
          return res.json().then(function (body) {
            return { ok: res.ok, body: body };
          });
        })
        .then(function (result) {
          if (result.ok) {
            form.reset();
            status.textContent = "{{ i18n "js_sent" }}";
            status.classList.add('form-status-ok');
          } else {
            status.textContent = (result.body && result.body.error) ||
              "{{ i18n "js_error" }}";
            status.classList.add('form-status-error');
          }
        })
        .catch(function () {
          status.textContent = "{{ i18n "js_error" }}";
          status.classList.add('form-status-error');
        })
        .finally(function () {
          btn.disabled = false;
        });
    });
  })();
</script>
{{ end }}
