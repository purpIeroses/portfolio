{{ define "main" }}
<section class="contact-page">
  <a class="case-back" href="{{ "/" | relURL }}">← Back home</a>

  <div class="contact-head">
    <h1>Let's build something.</h1>
    <p>Tell me what you need and I'll get back to you within a day or two — or
      email <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>
      directly if you'd rather skip the form.</p>
  </div>

  <form id="contact-form" class="contact-form" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="message">What do you need built?</label>
      <textarea id="message" name="message" rows="6" required></textarea>
    </div>
    <div class="field field-hp" aria-hidden="true">
      <label for="company">Company</label>
      <input type="text" id="company" name="company" tabindex="-1" autocomplete="off">
    </div>
    <button class="btn" type="submit">Send message →</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>
</section>

<script>
  (function () {
    var form = document.getElementById('contact-form');
    var status = form.querySelector('.form-status');
    var btn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = Object.fromEntries(new FormData(form).entries());

      btn.disabled = true;
      status.textContent = 'Sending…';
      status.className = 'form-status';

      fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(function (res) {
          return res.json().then(function (body) {
            return { ok: res.ok, body: body };
          });
        })
        .then(function (result) {
          if (result.ok) {
            form.reset();
            status.textContent = "Sent — I'll be in touch soon.";
            status.classList.add('form-status-ok');
          } else {
            status.textContent = (result.body && result.body.error) ||
              'Something went wrong. Try emailing me directly instead.';
            status.classList.add('form-status-error');
          }
        })
        .catch(function () {
          status.textContent = 'Something went wrong. Try emailing me directly instead.';
          status.classList.add('form-status-error');
        })
        .finally(function () {
          btn.disabled = false;
        });
    });
  })();
</script>
{{ end }}
