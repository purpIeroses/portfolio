<footer class="footer" id="contact">
  <div class="footer-inner">
    <p class="footer-cta">Have something that needs building?</p>
    <p class="footer-links">
      <a href="{{ "/contact/" | relURL }}">{{ .Site.Params.email }}</a>
      {{ with .Site.Params.github }}<span>·</span><a href="{{ . }}" target="_blank" rel="noopener">GitHub</a>{{ end }}
    </p>
    <p class="footer-fine">© {{ now.Year }} {{ .Site.Params.author }}. Built with Hugo.</p>
  </div>
</footer>
